<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شکوہ اور جوابِ شکوہ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&family=Cinzel:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0d2a22;--bg2:#05110d;--paper:#f4e9cf;--paper2:#e9d9b3;--ink:#2b1c10;
  --gold:#c9a24b;--gold2:#f0d58a;--green:#0f4a38;--green2:#082c21;--ui:#eadfc2;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{
  margin:0;height:100%;color:var(--ui);font-family:system-ui,sans-serif;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 35%,rgba(201,162,75,.16),transparent 60%),
    radial-gradient(circle at 20% 80%,rgba(15,74,56,.5),transparent 50%),
    repeating-conic-gradient(from 45deg at 50% 50%,rgba(201,162,75,.035) 0 12.5%,transparent 0 25%) 0 0/46px 46px,
    linear-gradient(160deg,var(--bg1),var(--bg2));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6))}
.stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:14px 10px 0;min-height:0}
#wrap{position:relative;filter:drop-shadow(0 28px 38px rgba(0,0,0,.65))}

/* ---------- pages ---------- */
.page{background:var(--paper);overflow:hidden}
.page-content{
  container-type:inline-size;width:100%;height:100%;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:11% 10%;
  background:
    radial-gradient(circle at 30% 20%,rgba(255,255,255,.55),transparent 55%),
    radial-gradient(circle at 80% 90%,rgba(160,120,50,.18),transparent 60%),
    repeating-linear-gradient(0deg,rgba(120,85,35,.025) 0 2px,transparent 2px 5px),
    var(--paper);
  color:var(--ink);
}
.page-content::before{ /* gold double frame */
  content:"";position:absolute;inset:4.5%;border:1px solid var(--gold);outline:1px solid rgba(201,162,75,.55);outline-offset:-5px;pointer-events:none;border-radius:2px
}
.page-content::after{ /* spine shade */
  content:"";position:absolute;inset:0;pointer-events:none
}
.stf__item.--left .page-content::after{background:linear-gradient(270deg,rgba(60,35,10,.28),transparent 14%)}
.stf__item.--right .page-content::after{background:linear-gradient(90deg,rgba(60,35,10,.28),transparent 14%)}
.corner{position:absolute;color:var(--gold);font-size:clamp(.7rem,4cqw,1.1rem);line-height:1}
.c1{top:6%;left:7%}.c2{top:6%;right:7%}.c3{bottom:6%;left:7%}.c4{bottom:6%;right:7%}
.verse{direction:rtl;text-align:center;font-family:'Noto Nastaliq Urdu',serif;font-size:clamp(.78rem,4.5cqw,1.55rem);line-height:2.55;position:relative;z-index:1}
.verse .l{display:block}
.verse .orn{display:block;color:var(--gold);font-size:.55em;line-height:1.6;letter-spacing:.6em;opacity:.9}
.pn{position:absolute;bottom:7%;left:0;right:0;text-align:center;font-family:'Cinzel',serif;font-size:clamp(.55rem,3cqw,.8rem);color:#8a6a2c;letter-spacing:.2em;z-index:1}
.sec{font-family:'Noto Nastaliq Urdu',serif;font-weight:600;font-size:clamp(1.6rem,13cqw,3.6rem);line-height:2.1;text-align:center;direction:rtl;color:#1c5a43;text-shadow:0 1px 0 #fff8,0 2px 6px rgba(201,162,75,.4);z-index:1}
.bigorn{color:var(--gold);letter-spacing:.7em;font-size:clamp(.8rem,5cqw,1.3rem);z-index:1}
.rule{width:46%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:.8em 0;z-index:1}

/* ---------- cover ---------- */
.cover .page-content{
  background:
    radial-gradient(circle at 50% 40%,rgba(240,213,138,.18),transparent 55%),
    repeating-conic-gradient(from 45deg at 50% 50%,rgba(240,213,138,.06) 0 12.5%,transparent 0 25%) 0 0/34px 34px,
    linear-gradient(145deg,var(--green),var(--green2));
  color:var(--gold2);
}
.cover .page-content::before{border:2px solid var(--gold2);outline:1px solid rgba(240,213,138,.6);outline-offset:-8px;inset:5%}
.cover .page-content::after{background:none!important}
.cover .corner{color:var(--gold2)}
.cover .sec{color:var(--gold2);text-shadow:0 2px 10px rgba(0,0,0,.6);font-size:clamp(2rem,17cqw,4.6rem);line-height:1.9}
.cover .sub{font-family:'Noto Nastaliq Urdu',serif;font-size:clamp(1rem,7cqw,1.9rem);color:#e7d29a;margin:.2em 0;z-index:1}
.cover .bigorn{color:var(--gold2)}
.spine-hard{box-shadow:inset 8px 0 14px rgba(0,0,0,.35)}
.end .sec{font-size:clamp(1.3rem,9cqw,2.4rem)}

/* ---------- controls ---------- */
.bar{
  margin:10px 0 14px;display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;
  background:rgba(8,26,20,.72);border:1px solid rgba(201,162,75,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5;
}
.bar button{
  background:transparent;color:var(--ui);border:0;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.05rem;display:grid;place-items:center;transition:background .2s
}
.bar button:hover{background:rgba(201,162,75,.25)}
.bar button:disabled{opacity:.3;cursor:default}
#info{min-width:76px;text-align:center;font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.12em;color:var(--gold2)}
.sep{width:1px;height:20px;background:rgba(201,162,75,.35);margin:0 4px}
dialog{width:min(92vw,640px);background:#fbf3df;color:#2b1c10;border:2px solid var(--gold);border-radius:14px;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog textarea{width:100%;height:42vh;direction:rtl;font-family:'Noto Nastaliq Urdu',serif;font-size:1rem;line-height:2.3;border:1px solid #c9b88a;border-radius:8px;padding:10px;background:#fffdf6;color:#111}
dialog p{margin:.2em 0 .8em;font-size:.88rem;line-height:1.55}
dialog .row{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
dialog .row button{border:0;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--gold);color:#1b1208}
dialog .row button.alt{background:transparent;border:1px solid var(--gold);color:#2b1c10}
#hint{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:0;right:0;text-align:center;font-size:.78rem;letter-spacing:.08em;color:rgba(234,223,194,.6);pointer-events:none;transition:opacity 1s}
</style>
</head>
<body>
<div id="hint">Click, drag a page corner, or swipe to turn</div>
<div class="stage"><div id="wrap"></div></div>
<div class="bar">
  <button id="last" title="Last page" aria-label="Last page">⏮</button>
  <button id="next" title="Next" aria-label="Next page">‹</button>
  <span id="info">1 / 1</span>
  <button id="prev" title="Previous" aria-label="Previous page">›</button>
  <button id="first" title="First page" aria-label="First page">⏭</button>
  <span class="sep"></span>
  <button id="fs" title="Fullscreen" aria-label="Fullscreen">⛶</button>
  <button id="edit" title="Paste full text" aria-label="Paste full text">✎</button>
</div>

<dialog id="dlg">
  <p><b>Paste the full poem here.</b> Leave a blank line between stanzas (one stanza per page). Start a line with <code>##</code> for a section title page, e.g. <code>## شکوہ</code> and <code>## جوابِ شکوہ</code>.</p>
  <textarea id="ta" spellcheck="false"></textarea>
  <div class="row"><button class="alt" id="cancel">Cancel</button><button id="build">Build flipbook</button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
const DEFAULT = `## شکوہ

کیوں زیاں کار بنوں، سود فراموش رہوں
فکرِ فردا نہ کروں، محوِ غمِ دوش رہوں
نالے بلبل کے سنوں اور ہمہ تن گوش رہوں
ہم نوا میں بھی کوئی گل ہوں کہ خاموش رہوں
جرأت آموز مری تابِ سخن ہے مجھ کو
شکوہ اللہ سے، خاکم بدہن، ہے مجھ کو

ہے بجا شیوۂ تسلیم میں مشہور ہیں ہم
قصۂ درد سناتے ہیں کہ مجبور ہیں ہم
سازِ خاموش ہیں، فریاد سے معمور ہیں ہم
نالہ آتا ہے اگر لب پہ تو معذور ہیں ہم
اے خدا! شکوۂ ارباب وفا بھی سن لے
خوگر حمد سے تھوڑا سا گلہ بھی سن لے

تھی تو موجود ازل سے ہی تری ذاتِ قدیم
پھول تھا زیبِ چمن پر نہ پریشاں تھی شمیم
شرطِ انصاف ہے اے صاحبِ الطافِ عمیم
بوئے گل پھیلتی کس طرح جو ہوتی نہ نسیم
ہم کو جمعیتِ خاطر یہ پریشانی تھی
ورنہ امت ترے محبوب کی دیوانی تھی؟

## جوابِ شکوہ

دل سے جو بات نکلتی ہے اثر رکھتی ہے
پر نہیں، طاقتِ پرواز مگر رکھتی ہے
قدسی الاصل ہے، رفعت پہ نظر رکھتی ہے
خاک سے اٹھتی ہے، گردوں پہ گزر رکھتی ہے
عشق تھا فتنہ گر و سرکش و چالاک مرا
آسماں چیر گیا نالۂ بے باک مرا`;

const $ = id => document.getElementById(id);
let pf = null, soundOn = true, ac, total = 1;

/* ---------- content -> page elements ---------- */
function parse(text){
  const out = [{t:'cover'}, {t:'blank'}];
  text.trim().split(/\n\s*\n/).forEach(b=>{
    const lines = b.split('\n').map(l=>l.trim()).filter(Boolean);
    if(!lines.length) return;
    if(lines[0].startsWith('##')){
      out.push({t:'title', text:lines[0].replace(/^#+\s*/,'')});
      const rest = lines.slice(1);
      if(rest.length) out.push({t:'verse', lines:rest});
    } else out.push({t:'verse', lines});
  });
  out.push({t:'end'});
  out.push({t:'back'});
  if(out.length % 2){ out.splice(out.length-1,0,{t:'blank'}); }
  return out;
}
function el(tag, cls, txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!==undefined) e.textContent=txt; return e; }
function corners(c){ ['c1','c2','c3','c4'].forEach(k=>c.appendChild(el('span','corner '+k,'❖'))); }

function pageEl(p, n){
  const page = el('div','page'), c = el('div','page-content');
  page.appendChild(c);
  if(p.t==='cover'||p.t==='back'){
    page.classList.add('cover'); page.dataset.density='hard'; corners(c);
    if(p.t==='cover'){
      c.appendChild(el('div','bigorn','❖ ❖ ❖'));
      c.appendChild(el('div','sec','شکوہ'));
      c.appendChild(el('div','rule'));
      c.appendChild(el('div','sub','اور'));
      c.appendChild(el('div','rule'));
      c.appendChild(el('div','sec','جوابِ شکوہ'));
      c.appendChild(el('div','bigorn','❖ ❖ ❖'));
    } else c.appendChild(el('div','bigorn','❖'));
  } else if(p.t==='title'){
    corners(c);
    c.appendChild(el('div','bigorn','❖ ❖ ❖'));
    c.appendChild(el('div','rule'));
    c.appendChild(el('div','sec',p.text));
    c.appendChild(el('div','rule'));
    c.appendChild(el('div','bigorn','❖ ❖ ❖'));
  } else if(p.t==='verse'){
    corners(c);
    const v = el('div','verse');
    p.lines.forEach((l,i)=>{
      v.appendChild(el('span','l',l));
      if(i%2===1 && i<p.lines.length-1) v.appendChild(el('span','orn','✦'));
    });
    c.appendChild(v);
    c.appendChild(el('div','pn', String(n)));
  } else if(p.t==='end'){
    corners(c); c.classList.add('end');
    c.appendChild(el('div','bigorn','❖ ❖ ❖'));
    c.appendChild(el('div','sec','تمّت بالخیر'));
    c.appendChild(el('div','bigorn','❖ ❖ ❖'));
  } else { corners(c); }
  return page;
}

function build(text){
  if(pf){ try{ pf.destroy(); }catch(e){} pf=null; }
  const old = $('wrap'); const fresh = el('div'); fresh.id='wrap'; old.replaceWith(fresh);
  const pages = parse(text); total = pages.length;
  for(let i=total-1;i>=0;i--) fresh.appendChild(pageEl(pages[i],i)); /* reversed: right-to-left book */
  const small = Math.min(window.innerWidth, 1000);
  pf = new St.PageFlip(fresh,{
    width:420, height:590, size:'stretch',
    minWidth:240, maxWidth:560, minHeight:340, maxHeight:790,
    showCover:true, usePortrait:true, startPage:total-1,
    drawShadow:true, maxShadowOpacity:.6, flippingTime:1100,
    mobileScrollSupport:false, swipeDistance:25, showPageCorners:true, disableFlipByClick:false
  });
  pf.loadFromHTML(fresh.querySelectorAll('.page'));
  pf.on('flip', e=>refresh(e.data));
  pf.on('init', ()=>refresh(total-1));
  refresh(total-1);
}
function refresh(idx){
  const i = idx ?? pf.getCurrentPageIndex();
  const k = Math.min(Math.max(total - i, 1), total);
  $('info').textContent = k + ' / ' + total;
  $('prev').disabled = $('first').disabled = i>=total-1;
  $('next').disabled = $('last').disabled = i<=0;
}

/* ---------- paper sound (synth, layered) ---------- */
function flipSound(){ /* sound removed */
  return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    const t0 = ac.currentTime, sr = ac.sampleRate;
    const out = ac.createGain(); out.gain.value = .9; out.connect(ac.destination);

    // 1) swish: shaped noise through sweeping band-pass
    const L = Math.floor(sr*.62), b1 = ac.createBuffer(1,L,sr), d1 = b1.getChannelData(0);
    let lp = 0;
    for(let i=0;i<L;i++){
      const t=i/L, env = Math.pow(Math.sin(Math.PI*Math.pow(t,.55)),1.4)*Math.pow(1-t,.7);
      lp += (Math.random()*2-1 - lp)*.55;             // slightly softened noise
      d1[i] = lp*env;
    }
    const s1 = ac.createBufferSource(); s1.buffer=b1;
    const bp = ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=.7;
    bp.frequency.setValueAtTime(1200,t0); bp.frequency.exponentialRampToValueAtTime(4200+Math.random()*900,t0+.38); bp.frequency.exponentialRampToValueAtTime(2200,t0+.6);
    const hp = ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=500;
    const g1 = ac.createGain(); g1.gain.value=.9;
    s1.connect(bp); bp.connect(hp); hp.connect(g1); g1.connect(out); s1.start(t0);

    // 2) paper crinkle: sparse tiny clicks
    const L2 = Math.floor(sr*.5), b2 = ac.createBuffer(1,L2,sr), d2 = b2.getChannelData(0);
    for(let i=0;i<L2;i++){
      const t=i/L2;
      if(Math.random() < .012*(1-t)*(t<.15?.3:1)) d2[i] = (Math.random()*2-1)*.9;
      if(i>0) d2[i] += d2[i-1]*.6;                    // tiny decay -> crackle grain
    }
    const s2 = ac.createBufferSource(); s2.buffer=b2;
    const f2 = ac.createBiquadFilter(); f2.type='highpass'; f2.frequency.value=2500;
    const g2 = ac.createGain(); g2.gain.value=.55;
    s2.connect(f2); f2.connect(g2); g2.connect(out); s2.start(t0+.02);

    // 3) soft landing thump
    const L3 = Math.floor(sr*.18), b3 = ac.createBuffer(1,L3,sr), d3 = b3.getChannelData(0);
    for(let i=0;i<L3;i++){ const t=i/L3; d3[i]=(Math.random()*2-1)*Math.pow(1-t,3); }
    const s3 = ac.createBufferSource(); s3.buffer=b3;
    const f3 = ac.createBiquadFilter(); f3.type='lowpass'; f3.frequency.value=380;
    const g3 = ac.createGain(); g3.gain.value=.8;
    s3.connect(f3); f3.connect(g3); g3.connect(out); s3.start(t0+.46);
  }catch(e){}
}

/* ---------- controls ---------- */
$('next').onclick = ()=>pf.flipPrev('bottom');
$('prev').onclick = ()=>pf.flipNext('bottom');
$('first').onclick = ()=>pf.flip(total-1,'top');
$('last').onclick = ()=>pf.flip(0,'top');
$('fs').onclick = ()=>{ try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }catch(e){} };
document.addEventListener('keydown', e=>{
  if(!pf) return;
  if(e.key==='ArrowLeft'||e.key===' '||e.key==='ArrowDown') pf.flipPrev('bottom');
  if(e.key==='ArrowRight'||e.key==='ArrowUp') pf.flipNext('bottom');
});
$('edit').onclick = ()=>{ if(!$('ta').value) $('ta').value = DEFAULT; $('dlg').showModal(); };
$('cancel').onclick = ()=>$('dlg').close();
$('build').onclick = ()=>{ build($('ta').value); $('dlg').close(); };
setTimeout(()=>{ $('hint').style.opacity=0; }, 5000);

document.fonts && document.fonts.ready ? document.fonts.ready.then(()=>build(DEFAULT)) : build(DEFAULT);
</script>
</body>
</html>
